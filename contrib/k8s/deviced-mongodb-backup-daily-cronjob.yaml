apiVersion: batch/v1
kind: CronJob
metadata:
  name: deviced-mongodb-backup-daily
  namespace: metathings-storage
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: backup
            image: registry.cn-hangzhou.aliyuncs.com/nayotta/bitnami-mongodb:8.0.4-debian-12-r0
            imagePullPolicy: IfNotPresent
            command:
            - bash
            - /scripts/deviced-mongodb-backup-daily.sh
            env:
            - name: MONGODB_URI
              value: "mongodb://mongodb-deviced-20241224-2.mongodb-deviced-20241224-headless.metathings-storage:27017/mt_devd_flw"
            volumeMounts:
            - mountPath: /scripts/deviced-mongodb-backup-daily.sh
              name: scripts
              subPath: deviced-mongodb-backup-daily.sh
            - mountPath: /mnt/backup
              name: backup-dir
            - mountPath: /tmp
              name: empty-dir
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 2000m
                memory: 4Gi
          - name: summary
            image: registry.cn-hangzhou.aliyuncs.com/nayotta/amancevice-pandas:jupyter-2.2.2
            imagePullPolicy: IfNotPresent
            command:
            - bash
            - /scripts/deviced-mongodb-backup-daily-summary.sh
            env:
            - name: BACKUP_INPROG_LOCK
              value: "/mnt/backup/backup_inprog.lck"
            - name: NEWEST_METADATA
              value: "/mnt/backup/newest_metadata"
            - name: SLACK_NOTIFICATION_URL
              value: !!!REPLACEME!!!
            volumeMounts:
            - mountPath: /scripts/deviced-mongodb-backup-daily-summary.sh
              name: scripts
              subPath: deviced-mongodb-backup-daily-summary.sh
            - mountPath: /scripts/deviced-mongodb-backup-daily-summary.py
              name: scripts
              subPath: deviced-mongodb-backup-daily-summary.py
            - mountPath: /mnt/backup
              name: backup-dir
            - mountPath: /tmp
              name: empty-dir
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 2000m
                memory: 4Gi

          volumes:
          - name: empty-dir
            emptyDir: {}
          - name: scripts
            configMap:
              name: metathings-deviced-scripts
          - name: backup-dir
            persistentVolumeClaim:
              claimName: metathings-deviced-backup-20241224
          restartPolicy: Never
  schedule: 17 04 * * *
  successfulJobsHistoryLimit: 3

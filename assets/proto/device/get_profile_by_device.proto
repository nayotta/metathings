syntax = "proto3";

package ai.metathings.service.device;
option go_package = "github.com/nayotta/metathings/proto/device";

import "assets/proto/deviced/model.proto";
import "model.proto";

message GetProfileByDeviceRequest {
  ai.metathings.service.deviced.OpDevice device = 1;
}

message GetProfileByDeviceResponse {
  ai.metathings.service.device.Profile profile = 1;
}
